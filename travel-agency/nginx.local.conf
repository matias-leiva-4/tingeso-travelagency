worker_processes  1;

pid .nginx/nginx.pid;
error_log .nginx/logs/error.log;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log .nginx/logs/access.log;
    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path .nginx/client_body_temp;
    proxy_temp_path .nginx/proxy_temp;
    fastcgi_temp_path .nginx/fastcgi_temp;
    uwsgi_temp_path .nginx/uwsgi_temp;
    scgi_temp_path .nginx/scgi_temp;

    server {
        listen 8081;
        server_name localhost;

        root dist;
        index index.html;

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
