# Nginx como balanceador de carga para las 3 réplicas del BACKEND.
# Docker Compose v2 resuelve "backend" como DNS round-robin a todas las réplicas.
upstream backend_cluster {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # Endpoint para verificar que el LB está vivo.
    location = /lb-health {
        access_log off;
        return 200 "backend-lb-ok\n";
        add_header Content-Type text/plain;
    }
}
