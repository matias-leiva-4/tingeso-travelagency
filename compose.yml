# TravelAgency — despliegue local y de producción (Docker Compose).
#
# Arquitectura (sección 4.3 del enunciado + guía del profesor):
#
#                 ┌─────────────────────────────────────────┐
#  Browser  ─────►│  nginx-frontend-lb  (puerto 8070)       │──► frontend × 3
#                 └─────────────────────────────────────────┘
#                 ┌─────────────────────────────────────────┐
#  Frontend ─────►│  nginx-backend-lb   (puerto 8090)       │──► backend × 3 ──► db
#                 └─────────────────────────────────────────┘                  └─► keycloak
#
# Componentes:
#   - db                 : PostgreSQL 16
#   - keycloak           : IAM (sección 4.5)
#   - backend            : Spring Boot, 3 réplicas
#   - nginx-backend-lb   : LB para las 3 réplicas del backend
#   - frontend           : React + nginx estático, 3 réplicas
#   - nginx-frontend-lb  : LB para las 3 réplicas del frontend (entrada pública)
#
# La aplicación corre en  →  http://localhost:8070/
#
# Uso:
#   docker compose up --build -d
#   docker compose down -v     # tumbar y borrar volumen
#
# /etc/hosts (una sola vez):
#   127.0.0.1 keycloak

services:
  db:
    image: postgres:16-alpine
    container_name: travelagency-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelagency_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Script SQL que crea la segunda BD (keycloak_db). Solo se ejecuta
      # la primera vez (si el volumen db_data está vacío).
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelagency_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [travelnet]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: travelagency-keycloak
    restart: unless-stopped
    # PRODUCCIÓN: usamos "start" (no "start-dev").
    # --optimized lo omitimos para no requerir un build previo (Keycloak hace
    # un build runtime con la config de env vars). Lo apropiado para esta entrega.
    # --import-realm carga el realm desde /opt/keycloak/data/import/ al primer arranque.
    command: ["start", "--http-port=9090", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Admin inicial — solo se crea la primera vez con la BD vacía
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Base de datos: producción exige BD externa, NO H2 in-memory
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Hostname: en local "keycloak" (vía /etc/hosts). En AWS, sobreescribir
      # con compose.aws.yml para usar la IP/dominio público.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak}
      KC_HOSTNAME_PORT: 9090
      KC_HOSTNAME_STRICT: "false"
      # Permitimos HTTP porque no tenemos TLS en esta entrega.
      # En producción real esto sería false + un reverse proxy con TLS.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Health checks para readiness
      KC_HEALTH_ENABLED: "true"
      # Logs en formato JSON (más profesional, parseable por agregadores)
      KC_LOG_LEVEL: INFO
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/travel-agency-realm.json:ro
    ports:
      - "9090:9090"
    networks: [travelnet]

  # ── Backend ──────────────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USER:-local}/travelagency-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      # Activa el perfil "production" → carga application-production.properties
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travelagency_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${KEYCLOAK_HOSTNAME:-keycloak}:9090/realms/travel-agency
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8070,http://127.0.0.1:8070}
    deploy:
      replicas: 3
    # No expone puertos al host: el acceso pasa por nginx-backend-lb.
    networks: [travelnet]

  nginx-backend-lb:
    image: nginx:1.27-alpine
    container_name: travelagency-nginx-backend-lb
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks: [travelnet]

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USER:-local}/travelagency-frontend:latest
    build:
      context: ./travel-agency
      args:
        # IMPORTANTE: estos valores se EMBEBEN en el bundle JS en build-time.
        # El navegador del usuario los lee, asi que tienen que ser URLs
        # publicamente accesibles desde su maquina (no nombres de red Docker).
        #   - En local: http://localhost:8090  y  http://keycloak:9090 (con /etc/hosts)
        #   - En cloud: http://<IP_PUBLICA>:8090  y  http://<IP_PUBLICA>:9090
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://keycloak:9090}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-travel-agency}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-travel-agency-frontend1}
    restart: unless-stopped
    deploy:
      replicas: 3
    # No expone puertos al host: el acceso pasa por nginx-frontend-lb.
    networks: [travelnet]

  nginx-frontend-lb:
    image: nginx:1.27-alpine
    container_name: travelagency-nginx-frontend-lb
    restart: unless-stopped
    depends_on:
      - frontend
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8070:80"
    networks: [travelnet]

networks:
  travelnet:
    driver: bridge

volumes:
  db_data:
