# Nginx como balanceador de carga para las 3 réplicas del FRONTEND.
# Cada réplica del frontend es un nginx que sirve los estáticos de React.
# Docker Compose v2 resuelve "frontend" como DNS round-robin a todas las réplicas.
upstream frontend_cluster {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Endpoint para verificar que el LB está vivo.
    location = /lb-health {
        access_log off;
        return 200 "frontend-lb-ok\n";
        add_header Content-Type text/plain;
    }
}
