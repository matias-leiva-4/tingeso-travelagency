spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ========================
# KEYCLOAK / JWT
# ========================
# El backend actua como Resource Server: valida el JWT firmado por Keycloak.
# El flujo de login lo inicia el frontend con Keycloak.js (PKCE).
# Sintaxis ${VAR:default}: si la env var no esta seteada usa el default (modo dev local).
# En el compose se inyecta SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9090/realms/travel-agency}

# ========================
# BASE DE DATOS
# ========================
# Todas las credenciales vienen por env vars. Los defaults son SOLO para
# desarrollo local (cuando corres ./mvnw spring-boot:run sin docker compose).
# En produccion el compose pasa estas env vars desde el archivo .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travelagency_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================
# CORS
# ========================
# Origenes permitidos. En el compose se sobreescribe con CORS_ALLOWED_ORIGINS
# para incluir las URLs publicas (AWS IP, dominio, etc.).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8070,http://127.0.0.1:8070,http://localhost:8081}

# ========================
# DESCUENTOS (reglas de negocio - Epica 4)
# ========================
discount.group.threshold=4
discount.group.percent=10

discount.frequent-client.min-reservations=3
discount.frequent-client.percent=15

discount.multi-package.days=30
discount.multi-package.percent=5

discount.max-percent=20

# Promocion temporal (dejar vacio para desactivar)
discount.promotion.percent=0
discount.promotion.start-date=
discount.promotion.end-date=

# Ventana de pago: horas que tiene el usuario para pagar antes de que expire
reservation.payment-window-hours=24
