# Configuracion de produccion.
# Se activa cuando SPRING_PROFILES_ACTIVE=production (lo pone el compose).
# Spring carga primero application.properties y luego SOBREESCRIBE con este.

# ========================
# JPA / HIBERNATE
# ========================
# "validate" verifica que las tablas existan y matcheen las entidades, pero NO
# las modifica. Si falla, sabes que falta una migracion -> mas seguro que "update".
# Si prefieres que el schema lo cree Hibernate la primera vez, usa "update".
# Para esta entrega usamos "update" porque no tenemos Flyway/Liquibase configurado.
spring.jpa.hibernate.ddl-auto=update

# En produccion NO mostramos el SQL en logs (ruido + posibles datos sensibles)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CRITICO: desactivar Open Session In View.
# Por defecto Spring mantiene la sesion Hibernate abierta durante TODA la request
# (incluyendo la serializacion a JSON). Esto produce lazy loading silencioso y
# queries N+1 que no detectas en dev pero matan el rendimiento en prod.
# Al ponerlo en false, lazy loading fuera del @Transactional lanza una excepcion
# explicita y te obliga a usar JOIN FETCH o @EntityGraph donde corresponde.
spring.jpa.open-in-view=false

# ========================
# CONNECTION POOL (HikariCP)
# ========================
# Tamanos explicitos. Con 3 replicas x 10 conexiones = 30 al PostgreSQL,
# muy por debajo del default max_connections de Postgres (100).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================
# LOGGING
# ========================
# Niveles de log mas restrictivos
logging.level.root=INFO
logging.level.com.travelagency.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ========================
# ACTUATOR
# ========================
# Solo exponer endpoints estrictamente necesarios en produccion
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ========================
# SERVER
# ========================
# Mensajes de error sin stack trace (no exponer detalles internos).
# En Spring Boot 4 las propiedades server.error.* se movieron a spring.web.error.*
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Graceful shutdown: cuando reinicias el contenedor, Spring espera hasta 20s
# a que terminen las requests en vuelo antes de cerrar. Importante con 3
# replicas detras de Nginx - permite reiniciar de a una sin perder requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compresion gzip de respuestas. Reduce ~70% el tamano de JSON grandes
# (listas de paquetes, reportes). El navegador descomprime automatico.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
