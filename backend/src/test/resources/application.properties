# ──────────────────────────────────────────────────────────────────────────
#  Configuracion para tests (sobrescribe application.properties en src/main)
#
#  En CI no hay PostgreSQL disponible, asi que usamos H2 en memoria.
#  En produccion (perfil 'production' + Docker) sigue usandose PostgreSQL.
# ──────────────────────────────────────────────────────────────────────────

# H2 in-memory DB con modo PostgreSQL para que las queries nativas funcionen igual
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/dropea el schema en cada arranque de test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Keycloak: en tests no validamos JWT real, pero Spring necesita un
# JwtDecoder configurado. Usamos un JWK Set URI dummy que nunca se llama
# porque los tests con @WebMvcTest/@DataJpaTest no levantan el filter chain.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/dummy-jwks

# Permite override de beans para mocks
spring.main.allow-bean-definition-overriding=true
